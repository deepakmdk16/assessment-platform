# Deployable wiring for the whole system: Postgres, the agent (runs untrusted
# candidate code), the platform API, and nginx serving the SPA.
# docs/DEPLOY.md is the walkthrough — including what must be in .env first.
#
#   docker compose up -d --build
#
# The agent builds from the sibling checkout. The two repos are developed side
# by side (see CLAUDE.md); if yours are laid out differently, override
# AGENT_CONTEXT in .env or run the agent from a pre-built image.
#
# Only `web` publishes a port. The API and the agent are reachable on the
# internal network only: the agent executes untrusted code and must never be
# addressable from outside, and the API is reached through nginx so that the app
# and the API share one origin (see web/nginx.conf).

# The default json-file driver has no ceiling, so on the single VM this targets
# it grows until it fills the disk the pgdata volume is on. Postgres then cannot
# write WAL, and a logging default turns into losing the product record. 10m x 5
# is that ceiling, per container.
#
# X08 means logs are no longer the whole observability story — there are metrics
# and error reporting now — but they are still where an incident is actually
# reconstructed, and LOG_FORMAT=json makes every line several times larger than
# the text line it replaces. The same 50 MB therefore buys noticeably less
# history: an operator who turns JSON on should raise max-size or ship the lines
# off the box, rather than assume the retention here is unchanged.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    networks: [backend]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assessment
      POSTGRES_DB: assessment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The platform waits on this: it runs `alembic upgrade head` at boot, and
      # that fails outright against a database still initialising. Probe over
      # TCP (-h): during initdb the image runs a temporary server bound to the
      # unix socket ONLY, and a socket-based pg_isready answers 0 there — the
      # platform would be released early and hit "connection refused" on 5432.
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  agent:
    networks: [grading]
    build:
      context: ${AGENT_CONTEXT:-../AssesmentAgent}
    # Least privilege for the one container that runs untrusted code. The server
    # inside is an unprivileged user holding no capabilities; the five below
    # exist only for the image's root entrypoint, which delegates the
    # container's own cgroup to that user and then drops every one of them
    # before anything else runs. Without them nsjail cannot build its jail and
    # every run fails loudly rather than executing code unsandboxed.
    # ../AssesmentAgent/deploy/docker-run.flags is the authoritative list, with
    # the reason for each — keep this block in step with it.
    cgroup: private
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, CHOWN, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
      - systempaths=unconfined
      # Must be loaded on the host first (docs/DEPLOY.md, Prerequisites).
      - apparmor=${AGENT_APPARMOR_PROFILE:-assess-nsjail}
      # Resolved against this file's directory, like the build context.
      - seccomp=${AGENT_CONTEXT:-../AssesmentAgent}/deploy/seccomp.json
    # An outer bound on the whole container, jails included. It shares this
    # host with Postgres, and compilers run with no memory ceiling of their own.
    mem_limit: ${AGENT_MEM_LIMIT:-2g}
    pids_limit: 512
    environment:
      # Shared secrets: the platform authenticates to the agent with
      # ASSESS_API_TOKEN and verifies the callback with CALLBACK_TOKEN; the
      # *_SIGNING_SECRET pair HMACs the bodies in each direction. Both sides
      # must agree, so they are set from the same .env values here.
      ASSESS_API_TOKEN: ${ASSESS_API_TOKEN:?set ASSESS_API_TOKEN in .env}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:?set CALLBACK_TOKEN in .env}
      ASSESS_SIGNING_SECRET: ${ASSESS_SIGNING_SECRET:?set ASSESS_SIGNING_SECRET in .env}
      CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:?set CALLBACK_SIGNING_SECRET in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Pin the provider. Left unset, the agent auto-selects Ollama whenever
      # ANTHROPIC_API_KEY is absent and then fails every LLM call in a container
      # that has no Ollama — ../AssesmentAgent/STATUS.md A02. Pinning it here
      # is the deployment
      # half of that workaround; the code fix is still open.
      ASSESS_LLM_PROVIDER: ${ASSESS_LLM_PROVIDER:-anthropic}
      ASSESS_TRUST_PROXY_HEADERS: "false"
      # Observability (X08). This service has no `env_file:`, so a variable that
      # is not named here never reaches it — and the agent reads ASSESS_-prefixed
      # names, so the unprefixed LOG_FORMAT/SENTRY_DSN the platform reads from
      # .env are invisible to it. Every one has a default: a required variable
      # here would break `docker compose up` for an operator upgrading with an
      # existing .env. Unset DSN = Sentry never initialises.
      ASSESS_LOG_LEVEL: ${ASSESS_LOG_LEVEL:-INFO}
      ASSESS_LOG_FORMAT: ${ASSESS_LOG_FORMAT:-text}
      ASSESS_SENTRY_DSN: ${ASSESS_SENTRY_DSN:-}
      ASSESS_SENTRY_ENVIRONMENT: ${ASSESS_SENTRY_ENVIRONMENT:-production}
      ASSESS_SENTRY_RELEASE: ${ASSESS_SENTRY_RELEASE:-}
      ASSESS_SENTRY_TRACES_SAMPLE_RATE: ${ASSESS_SENTRY_TRACES_SAMPLE_RATE:-0}
    logging: *logging
    restart: unless-stopped

  platform:
    networks: [edge, backend, grading]
    build:
      context: .
    # Everything not wired below — SMTP, JWT_SECRET, Stripe, rate limits — comes
    # from .env. Values in `environment:` override it, and the ones here are the
    # settings that are only correct *inside* this compose network.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assessment:${POSTGRES_PASSWORD}@db:5432/assessment
      AGENT_BASE_URL: http://agent:8000
      # The same four shared secrets the agent gets above, from the same
      # substitution — stated here rather than left to `.env` so both services
      # provably read ONE source. Sourcing the agent's from compose and the
      # platform's from env_file looks equivalent and is not: any run where the
      # two files differ (a --env-file override, say) leaves the platform
      # sending no token and every trigger 401s at the agent with nothing in the
      # platform's own log to say why.
      ASSESS_API_TOKEN: ${ASSESS_API_TOKEN:?set ASSESS_API_TOKEN in .env}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:?set CALLBACK_TOKEN in .env}
      ASSESS_SIGNING_SECRET: ${ASSESS_SIGNING_SECRET:?set ASSESS_SIGNING_SECRET in .env}
      CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:?set CALLBACK_SIGNING_SECRET in .env}
      # Where the agent posts results back to. A hostname, so it passes the
      # agent's SSRF guard, which rejects literal private addresses.
      PLATFORM_BASE_URL: http://platform:9000
      # The public origin. Every invite link the API mints points here, so it
      # must be what a candidate can actually open — not the internal name.
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      # PLATFORM_BASE_URL is internal http, and COOKIE_SECURE is derived from it
      # unless set (config.py). Behind TLS that derivation is wrong and the
      # session cookie would go out without Secure, so state it explicitly.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # nginx is the single hop in front of this service (web/nginx.conf).
      TRUST_PROXY_HEADERS: "true"
      # In-memory counters are per-process, so every replica would grant its own
      # full allowance; the DB backend is the only correct one off a single worker.
      RATE_LIMIT_BACKEND: db
      # Production evolves the schema through Alembic only (see db.py).
      AUTO_CREATE_TABLES: "false"
      # Observability (X08). These do arrive through `env_file:` as well; naming
      # them here keeps the platform's half of the surface readable beside the
      # agent's, which has no env_file and depends on being listed. The defaults
      # match config.py, so an existing .env keeps behaving exactly as it did.
      # METRICS_TOKEN guards GET /metrics, which is fail-closed (503 without it):
      # per-status submission counts are a tenant's hiring volume (nginx refuses
      # /api/metrics from outside either way; see web/nginx.conf.template).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_AUTH_DISABLED: ${METRICS_AUTH_DISABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_started
    logging: *logging
    restart: unless-stopped

  web:
    networks: [edge]
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the bundle at build time — changing it needs a rebuild.
        VITE_API_BASE_URL: /api
        VITE_PRODUCT_NAME: ${VITE_PRODUCT_NAME:-assess.dev}
    environment:
      # Whose X-Forwarded-For nginx believes. Loopback (trust nobody) is right
      # when nginx is the edge; behind a TLS terminator this must be that
      # terminator, or every caller shares one rate-limit bucket.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      platform:
        condition: service_started
    logging: *logging
    restart: unless-stopped

networks:
  # The agent executes untrusted code, so it is deliberately NOT on the database
  # network: code that escapes the jail can still reach whatever its container
  # can, and that must not include the product record. It shares `grading` with
  # the platform only, which is the minimum the callback needs. `edge` is nginx
  # to the API; `backend` is the API to Postgres.
  edge:
  backend:
  grading:

volumes:
  pgdata:
