# Security response headers, in one file because nginx's `add_header` does NOT
# merge across levels: a block that declares any add_header of its own inherits
# none of the enclosing level's. `location /assets/` and `location = /index.html`
# each set Cache-Control, and every response the app is made of comes out of one
# of those two — so this file is included there as well as in `server`, and
# tests/test_security_headers.py fails the build if a new such block forgets it.
#
# Not a .template: none of these values is deployment-specific except HSTS,
# which comes in through the $hsts_header variable the server block sets.

# No script-src: it falls back to default-src 'self', which is exactly what the
# Vite bundle is — every script is a hashed file under /assets on this origin.
# 'unsafe-inline' is scoped to styles because Monaco injects <style> elements at
# runtime, and blob: covers the editor's web workers (worker-src) and the object
# URLs the PDF/CSV exports hand to the browser (img-src). connect-src 'self' is
# enough because nginx fronts the API on this same origin; the Stripe hops are
# top-level navigations, which CSP does not restrict. frame-ancestors 'none'
# replaces X-Frame-Options — it is the modern spelling and covers clickjacking
# of the candidate's editor.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;

# no-referrer rather than the browser default: an invite URL carries the token
# in its path, so any outbound link from a candidate's screen would otherwise
# leak a live invite to a third party's logs.
add_header Referrer-Policy "no-referrer" always;

# HSTS is a deployment decision, not a code one: it does nothing over plain HTTP
# (the compose default) and a wrong max-age is sticky for exactly as long as it
# claims. $hsts_header is rendered from ${HSTS_HEADER} in default.conf.template
# and is empty unless the deployment sets it; nginx omits an add_header whose
# value evaluates to the empty string, so this line then costs nothing.
add_header Strict-Transport-Security $hsts_header always;

# `always` on all four: without it nginx drops the header on 4xx/5xx responses,
# which is where an injected page is most likely to be served from.
