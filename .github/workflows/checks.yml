name: Checks

# The offline gate: pytest / ruff / mypy, the web build+typecheck+lint+unit
# suite, and the secret scan. This is the same `scripts/checkpoints.sh` the
# local pre-push hook runs — deliberately invoked rather than re-listed here, so
# there is exactly one definition of "the gates" and CI cannot drift from what
# runs on your machine.
#
# The local hook is skippable (`--no-verify`) and absent on a fresh clone until
# `scripts/install-hooks.sh` is run; this workflow is neither. Playwright E2E
# stays in its own workflow (e2e.yml) — checkpoints.sh leaves it opt-in behind
# RUN_E2E, and CI gates it separately.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (installs Python from pyproject)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # checkpoints.sh runs `npm run typecheck/lint/test/build` in web/ and
      # assumes node_modules is already there.
      - name: Install frontend deps
        run: npm ci
        working-directory: web

      # mypy's incremental cache: ~10s cold in CI, under a second warm. Keyed per
      # commit so each run saves a fresh one; restore-keys picks up the latest.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-

      - name: Run checkpoints (pytest, ruff, mypy, web gates, secret scan)
        run: bash scripts/checkpoints.sh

  # The unit suite runs on in-memory SQLite by design (fast, offline). This job is
  # the only place the driver, the migration chain and a real boot are exercised
  # against the production database — the 2026-09-06 audit found "Postgres-ready"
  # was true of the migrations but the driver wasn't even a dependency.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/ci
      PLATFORM_TESTING: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (installs Python from pyproject)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: uv sync

      - name: Migrate a fresh Postgres to head and assert the models match it
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Boot the API against Postgres and hit /health (which queries the DB)
        run: |
          uv run platform-api &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/health | grep -q '"ok"'
          kill %1
